# Repository-tracked authoritative configuration for CHUKLOV staging host Nginx
# Listens on internal loopback port 18081 behind TLS termination proxy

server {
    listen 127.0.0.1:18081;
    server_name crm.psysoldatov.ru;
    root /opt/chuklov-staging/current/public;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/x-javascript image/svg+xml;

    # Immutable fingerprinted Vite / Inertia build assets
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @app;
    }

    # Static brand, font, and portal assets
    location ~* ^/(fonts|brand|portal-assets)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri @app;
    }

    # Filament vendor static assets
    location ~* ^/(css|js)/filament/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri @app;
    }

    # Static images and icons
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri @app;
    }

    # All dynamic application requests proxy to container web runtime
    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
