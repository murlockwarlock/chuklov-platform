services:
  app:
    environment:
      MAIL_QA_AUTH_ENABLED: "true"
      MAIL_QA_AUTH_DOMAIN: qa.invalid
      MAIL_QA_AUTH_HOST: 127.0.0.1
      MAIL_QA_AUTH_PORT: "1025"
  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.3
    restart: unless-stopped
    depends_on:
      - app
    network_mode: service:app
    environment:
      MP_UI_BIND_ADDR: 127.0.0.1:8025
      MP_SMTP_BIND_ADDR: 127.0.0.1:1025
      MP_MAX_MESSAGES: "50"
      MP_MAX_AGE: 24h
      MP_SMTP_ALLOWED_RECIPIENTS: '@qa\.invalid$'
    mem_limit: 128m
    cpus: 0.10
    pids_limit: 64
