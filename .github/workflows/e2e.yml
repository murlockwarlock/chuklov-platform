name: E2E

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: Optional Playwright title filter for a targeted test file
        required: false
        default: ''
        type: string
      test_path:
        description: Playwright test file to run for a targeted dispatch
        required: false
        default: tests/e2e/crm.spec.ts
        type: string
  schedule:
    - cron: '15 2 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright desktop and mobile
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-trixie
        env:
          POSTGRES_DB: chuklov
          POSTGRES_USER: chuklov
          POSTGRES_PASSWORD: chuklov_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chuklov -d chuklov"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.2.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8000
      CLIENT_PORTAL_URL: https://mini.example.test
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: chuklov
      DB_USERNAME: chuklov
      DB_PASSWORD: chuklov_local
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      DEFAULT_ORGANIZATION_ID: 1
      TELEGRAM_BOT_USERNAME: chuklov_test_bot
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql, zip
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '24.6.0'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && scripts/initialize-app-key.sh php artisan key:generate --no-interaction
      - run: npm ci
      - run: php artisan migrate --seed --force
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Run Playwright suite
        env:
          E2E_TEST_FILTER: ${{ inputs.test_filter }}
          E2E_TEST_PATH: ${{ inputs.test_path }}
        run: |
          if [ -n "$E2E_TEST_FILTER" ]; then
            npx playwright test "${E2E_TEST_PATH:-tests/e2e/crm.spec.ts}" -g "$E2E_TEST_FILTER"
          elif [ -n "$E2E_TEST_PATH" ]; then
            npx playwright test "$E2E_TEST_PATH"
          else
            npm run test:e2e
          fi
      - if: failure()
        name: Print safe portal reschedule diagnostics
        run: grep -R -F 'portal.booking.reschedule.' storage/logs || true
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
