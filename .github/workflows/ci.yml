name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-trixie
        env:
          POSTGRES_DB: chuklov_test
          POSTGRES_USER: chuklov
          POSTGRES_PASSWORD: chuklov_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chuklov -d chuklov_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.2.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: chuklov_test
      DB_USERNAME: chuklov
      DB_PASSWORD: chuklov_local
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      DEFAULT_ORGANIZATION_ID: 1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pcntl, pdo_pgsql, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate --no-interaction
      - run: npm ci
      - run: php artisan migrate --seed --force
      - run: make quality
      - run: make test-integration
