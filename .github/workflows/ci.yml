name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality and integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-trixie
        env:
          POSTGRES_DB: chuklov_test
          POSTGRES_USER: chuklov
          POSTGRES_PASSWORD: chuklov_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chuklov -d chuklov_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.2.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: chuklov_test
      DB_USERNAME: chuklov
      DB_PASSWORD: chuklov_local
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      DEFAULT_ORGANIZATION_ID: 1
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pcntl, pdo_pgsql, zip
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '24.6.0'
          cache: npm
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Initialize application environment
        run: cp .env.example .env && scripts/initialize-app-key.sh php artisan key:generate --no-interaction
      - name: Install frontend dependencies
        run: npm ci
      - name: Migrate foundation schema
        run: php artisan migrate --seed --force
      - name: Verify repeatable key initialization
        run: make check-app-key
      - name: Run quality suite
        run: make quality
      - name: Run PostgreSQL, pgvector, Redis, queue, and health integration tests
        run: make test-integration

  e2e:
    name: Playwright desktop and mobile
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-trixie
        env:
          POSTGRES_DB: chuklov
          POSTGRES_USER: chuklov
          POSTGRES_PASSWORD: chuklov_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chuklov -d chuklov"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.2.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: chuklov
      DB_USERNAME: chuklov
      DB_PASSWORD: chuklov_local
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      DEFAULT_ORGANIZATION_ID: 1
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql, zip
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '24.6.0'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && scripts/initialize-app-key.sh php artisan key:generate --no-interaction
      - run: npm ci
      - run: php artisan migrate --seed --force
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  privacy:
    name: Privacy and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify sanitized Docker build context
        run: make check-docker-context
      - name: Scan reachable history and working tree for secrets
        run: make scan-secrets

  docker-runtime:
    name: Docker build and runtime health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Initialize environment
        run: cp .env.example .env
      - name: Install locked dependencies and initialize application
        run: make COMPOSE='docker compose' setup
      - name: Build application, Horizon, and scheduler images
        run: docker compose build app horizon scheduler
      - name: Start dependency-aware runtime
        run: docker compose up -d --force-recreate app horizon scheduler
      - name: Verify application health
        run: |
          for attempt in $(seq 1 30); do
            health_status="$(curl --silent --show-error --output /tmp/health-response --write-out '%{http_code}' http://127.0.0.1:8000/health || true)"
            if [ "$health_status" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          echo 'Health response body:'
          head -c 4000 /tmp/health-response 2>/dev/null || true
          tail -c 4000 /tmp/health-response 2>/dev/null || true
          exit 1
      - name: Verify Horizon runtime
        run: docker compose exec -T app php artisan horizon:status
      - name: Show runtime status
        run: docker compose ps
      - if: failure()
        name: Show bounded runtime logs
        run: docker compose logs --tail=120 app horizon scheduler postgres redis
      - if: always()
        name: Stop isolated runtime
        run: docker compose down --volumes
